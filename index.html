<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chrmgrm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1a1aff;
    --window-bg: #ffffff;
    --titlebar-bg: #e6e6e6;
    --text-main: #1a1a1a;
    --text-muted: #8a8a8a;
    --link-hover: #f2f2f2;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--blue);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    position: relative;
  }

  .desktop-icons {
    position: absolute;
    top: 32px;
    left: 32px;
    display: flex;
    gap: 20px;
  }

  .desktop-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 72px;
    cursor: pointer;
    user-select: none;
    text-decoration: none;
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
  }

  .desktop-icon:focus-visible {
    outline: 2px solid #fff;
    outline-offset: 4px;
    border-radius: 6px;
  }

  .desktop-icon .folder {
    width: 52px;
    height: 52px;
    object-fit: contain;
  }

  .desktop-icon .app-icon {
    width: 52px;
    height: 52px;
    object-fit: contain;
  }

  .desktop-icon span {
    font-size: 12px;
    color: #fff;
    text-shadow: 0px 4px 4px rgba(0,0,0,0.25);
    letter-spacing: 0.01em;
  }

  .personal-block {
    position: absolute;
    top: 130px;
    left: 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    user-select: none;
  }

  .personal-label {
    font-size: 11px;
    text-transform: lowercase;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.6);
    margin: 0 0 2px;
    text-shadow: 0px 4px 4px rgba(0,0,0,0.25);
  }

  .personal-links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .personal-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: #fff;
    font-size: 14px;
    text-shadow: 0px 4px 4px rgba(0,0,0,0.25);
    width: fit-content;
    transition: transform 0.15s ease;
  }

  .personal-link:hover {
    transform: translateX(4px);
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.telegram { background: #4dd8d8; }
  .status-dot.instagram { background: #ffb020; }

  @media (max-width: 480px) {
    .desktop-icons { top: 16px; left: 16px; }
    .personal-block { top: 108px; left: 16px; }
  }

  .window {
    width: 100%;
    max-width: 707px;
    background: var(--window-bg);
    border-radius: 10px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 50%;
    left: 50%;
    margin: 0;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.98);
    pointer-events: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }

  .window.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }

  .titlebar {
    background: var(--titlebar-bg);
    height: 26px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    position: relative;
    border-bottom: 1px solid #d5d5d5;
    cursor: grab;
  }

  .titlebar.dragging {
    cursor: grabbing;
  }

  .window.dragging {
    user-select: none;
  }

  .traffic-lights {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    display: block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    border: none;
    padding: 0;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    line-height: 1;
  }
  .dot.red { background: #ff5f57; }
  .dot.yellow { background: #febc2e; }
  .dot.green { background: #28c840; }

  .dot.red,
  .dot.yellow {
    cursor: pointer;
  }
  .dot.red:hover,
  .dot.yellow:hover {
    filter: brightness(1.15);
  }

  .titlebar-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #555;
  }

  .content {
    padding: 48px 48px 52px;
    max-height: 70vh;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #d0d0d0 transparent;
  }

  .content::-webkit-scrollbar {
    width: 8px;
  }

  .content::-webkit-scrollbar-thumb {
    background: #d0d0d0;
    border-radius: 4px;
  }

  .content::-webkit-scrollbar-track {
    background: transparent;
  }

  .name {
    font-size: 28px;
    font-weight: 500;
    margin: 0 0 6px;
    color: var(--text-main);
    letter-spacing: -0.01em;
    text-shadow: 0px 4px 4px rgba(0,0,0,0.25);
  }

  .bio {
    font-size: 16px;
    color: var(--text-main);
    margin: 0 0 40px;
    text-shadow: 0px 4px 4px rgba(0,0,0,0.25);
  }

  .section-label {
    font-size: 11px;
    text-transform: lowercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 0 0 8px 4px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .link-item {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    text-decoration: none;
    color: var(--text-main);
    font-size: 15px;
    transition: background 0.15s ease, transform 0.15s ease;
    text-shadow: 0px 4px 4px rgba(0,0,0,0.25);
    width: fit-content;
  }

  .link-item:hover {
    transform: translateX(4px);
  }

  .link-item:hover {
    background: var(--link-hover);
  }

  .link-item .icon {
    width: 18px;
    text-align: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .link-item.no-icon {
    padding-left: 34px;
  }

  @media (max-width: 480px) {
    .content { padding: 36px 28px 40px; max-height: 76vh; }
    .name { font-size: 24px; }
  }

  /* ---- Gallery window (Photos-app import style) ---- */

  .window.photos-window {
    max-width: 814px;
    width: 95vw;
    height: 538px;
    max-height: 90vh;
  }

  .photos-titlebar {
    height: 40px;
    gap: 12px;
    cursor: grab;
  }

  .photos-titlebar.dragging {
    cursor: grabbing;
  }

  .sidebar-toggle-btn {
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #666;
    flex-shrink: 0;
    appearance: none;
    -webkit-appearance: none;
  }
  .sidebar-toggle-btn:hover { background: rgba(0,0,0,0.06); }
  .sidebar-toggle-btn svg { width: 16px; height: 16px; }

  .import-title {
    font-size: 14px;
    font-weight: 600;
    color: #1a1a1a;
  }

  .photos-titlebar-spacer { flex: 1; }

  .titlebar-mode {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    min-width: 0;
  }

  .detail-back-btn {
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #444;
    flex-shrink: 0;
    appearance: none;
    -webkit-appearance: none;
  }
  .detail-back-btn:hover { background: rgba(0,0,0,0.06); }
  .detail-back-btn svg { width: 15px; height: 15px; }

  .detail-title-group {
    flex: 1;
    min-width: 0;
    text-align: center;
    overflow: hidden;
  }
  .detail-title {
    font-size: 12.5px;
    font-weight: 600;
    color: #1a1a1a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .detail-meta {
    font-size: 10.5px;
    color: #999;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .detail-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }

  .icon-btn {
    width: 26px;
    height: 26px;
    border: none;
    background: transparent;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #555;
    appearance: none;
    -webkit-appearance: none;
  }
  .icon-btn:hover { background: rgba(0,0,0,0.06); }
  .icon-btn svg { width: 14px; height: 14px; }
  .icon-btn.is-active { color: #ff375f; }

  .zoom-slider {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #aaa;
    font-size: 14px;
  }
  .zoom-slider input[type="range"] {
    width: 90px;
    accent-color: #0a6cff;
  }

  .btn-secondary,
  .btn-primary {
    font-size: 12.5px;
    padding: 5px 13px;
    border-radius: 6px;
    border: 1px solid #d7d7d7;
    background: #fff;
    cursor: pointer;
    color: #1a1a1a;
    appearance: none;
    -webkit-appearance: none;
  }
  .btn-secondary {
    color: #b7b7b7;
    border-color: #e6e6e6;
    cursor: default;
  }
  .btn-primary:hover { background: #f3f3f3; }

  .photos-subtoolbar {
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 9px 20px;
    border-bottom: 1px solid #ececec;
    font-size: 12.5px;
    color: #333;
    flex-shrink: 0;
  }
  .photos-subtoolbar label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: #999;
  }
  .album-select {
    color: #333;
  }
  .album-select select {
    font-size: 12.5px;
    border: 1px solid #d8d8d8;
    border-radius: 5px;
    padding: 2px 6px;
    background: #fff;
    color: #333;
  }

  .photos-body {
    display: flex;
    flex: 1;
    min-height: 0;
  }

  .photos-sidebar {
    width: 180px;
    flex-shrink: 0;
    background: #f6f6f6;
    border-right: 1px solid #e6e6e6;
    padding: 12px 8px;
    font-size: 12.5px;
    color: #333;
    overflow-y: auto;
  }

  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .sidebar-item:hover { background: rgba(0,0,0,0.05); }
  .sidebar-item.active { background: #0a6cff; color: #fff; }
  .sidebar-item .icon {
    width: 15px;
    text-align: center;
    font-size: 12.5px;
  }

  .sidebar-group-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #999;
    margin: 13px 0 4px 8px;
  }

  .photos-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .photos-count {
    font-size: 12.5px;
    font-weight: 600;
    color: #333;
    margin: 12px 0 10px 20px;
    flex-shrink: 0;
  }

  .photos-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    padding: 0 20px 20px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #d0d0d0 transparent;
  }

  .photo-tile {
    aspect-ratio: 1 / 1;
    border-radius: 2px;
    position: relative;
    display: block;
    overflow: hidden;
    background: #1a1a1a;
    text-decoration: none;
    border: none;
    padding: 0;
    appearance: none;
    -webkit-appearance: none;
  }

  .photo-tile.is-video {
    cursor: pointer;
  }

  /* ---- Detail / player view ---- */

  .photos-grid-view,
  .photos-detail-view {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .detail-stage {
    flex: 1;
    min-height: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .detail-stage img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    transition: transform 0.15s ease;
  }

  .detail-placeholder-block {
    width: 100%;
    height: 100%;
  }

  .detail-filmstrip {
    flex-shrink: 0;
    height: 78px;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
    overflow-x: auto;
    background: #fafafa;
    border-top: 1px solid #ececec;
    scrollbar-width: thin;
    scrollbar-color: #d0d0d0 transparent;
  }

  .filmstrip-thumb {
    flex-shrink: 0;
    width: 44px;
    height: 60px;
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    border: 2px solid transparent;
    background: #1a1a1a;
    padding: 0;
    appearance: none;
    -webkit-appearance: none;
  }
  .filmstrip-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .filmstrip-thumb.active { border-color: #0a6cff; }

  /* ---- Custom video player (matches the QuickTime-style overlay controls) ---- */

  .video-player {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .video-backdrop {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(45px) brightness(0.5) saturate(1.1);
    transform: scale(1.15);
    pointer-events: none;
  }

  .video-main {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    background: transparent;
  }

  .video-controls {
    position: absolute;
    z-index: 2;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    background: rgba(35,35,38,0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 10px;
    padding: 8px 14px 9px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 230px;
  }

  .video-controls-row {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .video-controls-spacer { flex: 1; }

  .video-controls button {
    background: none;
    border: none;
    cursor: pointer;
    color: #e2e2e2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px;
    appearance: none;
    -webkit-appearance: none;
  }
  .video-controls button:hover { color: #fff; }
  .video-controls button svg { width: 13px; height: 13px; }
  .video-controls .vc-play svg { width: 15px; height: 15px; }

  .video-controls input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    background: rgba(255,255,255,0.25);
  }
  .video-controls input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 2px rgba(0,0,0,0.5);
  }
  .video-controls input[type="range"]::-moz-range-thumb {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff;
    border: none;
  }
  .vc-volume { width: 64px; }
  .vc-seek { width: 100%; }

  @media (max-width: 640px) {
    .detail-title-group { display: none; }
    .video-controls { min-width: 180px; }
  }

  .photo-tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.2s ease;
  }

  .photo-tile:hover img {
    transform: scale(1.05);
  }

  .photo-tile.is-video::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.45), transparent 45%);
    pointer-events: none;
  }

  .photo-tile.is-video::before {
    content: '▶';
    position: absolute;
    left: 6px;
    bottom: 5px;
    color: #fff;
    font-size: 10px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    z-index: 1;
  }

  @media (max-width: 640px) {
    .photos-sidebar { display: none; }
    .photos-grid { grid-template-columns: repeat(3, 1fr); }
    .zoom-slider { display: none; }
  }
</style>
</head>
<body>

  <div class="desktop-icons">
    <a class="desktop-icon" href="https://payhip.com/frstup6d" target="_blank" rel="noopener">
      <img class="folder" src="folder-icon.png" alt="payhip folder">

      <span>info</span>

    <button class="desktop-icon" data-window="galleryWindow" type="button" aria-label="Открыть окно gallery">

      <span>gallery</span>

  </div>

  <div class="personal-block">

    <div class="personal-links">
      <a class="personal-link" href="https://t.me/chrmgrm" target="_blank" rel="noopener">
        <span class="status-dot telegram"></span> telegram
      </a>
      <a class="personal-link" href="https://www.instagram.com/artyomgosling/" target="_blank" rel="noopener">
        <span class="status-dot instagram"></span> instagram
      </a>

  </div>

  <div class="window" id="infoWindow">

    <div class="content">

      <p class="section-label">editing</p>

        <a class="link-item" href="https://t.me/chrmgrm_aep" target="_blank" rel="noopener">
          <span class="icon">📝</span> telegram
        </a>
        <a class="link-item" href="https://www.instagram.com/frstup6d/" target="_blank" rel="noopener">
          <span class="icon">🎥</span> instagram
        </a>
        <a class="link-item" href="https://soundcloud.com/adrenanalean" target="_blank" rel="noopener">
          <span class="icon">🎧</span> soundcloud
        </a>
        <a class="link-item no-icon" href="https://www.cosmos.so/frstup6d" target="_blank" rel="noopener">cosmos</a>
      </div>
    </div>
  </div>

  <div class="window photos-window" id="galleryWindow">
    <div class="titlebar photos-titlebar">
      <div class="traffic-lights">
        <button class="dot red" type="button" aria-label="Закрыть окно"></button>
        <button class="dot yellow" type="button" aria-label="Скрыть окно"></button>
        <span class="dot green"></span>
      </div>
      <div class="titlebar-mode" id="gridModeBar">
        <button class="sidebar-toggle-btn" type="button" aria-label="Показать/скрыть боковую панель">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/>
            <line x1="7.5" y1="3" x2="7.5" y2="17" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
        <span class="import-title">Import</span>
        <div class="photos-titlebar-spacer"></div>
        <div class="zoom-slider">
          <span>–</span>
          <input type="range" min="0" max="100" value="35">
          <span>+</span>
        </div>
        <button class="btn-secondary" type="button" disabled>Import Selected</button>
        <button class="btn-primary" type="button">Import All New Photos</button>
      </div>

      <div class="titlebar-mode" id="detailModeBar" hidden>
        <button class="sidebar-toggle-btn" type="button" aria-label="Показать/скрыть боковую панель">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.4"/>

            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 3v9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M6.5 6.5L10 3l3.5 3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4.5 10.5v4a1.5 1.5 0 001.5 1.5h8a1.5 1.5 0 001.5-1.5v-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>

          <button class="icon-btn" type="button" id="detailFavBtn" title="Mark as a favorite">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 16.5s-6-3.6-6-8.1C4 5.8 5.8 4 8 4c0.9 0 1.8 0.4 2 1.2C10.2 4.4 11.1 4 12 4c2.2 0 4 1.8 4 4.4 0 4.5-6 8.1-6 8.1z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </button>

          </button>
          <button class="icon-btn" type="button" title="Adjust">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 15L15 4l1 1L5 16z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12 4.5l1.5 1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>

        <button class="btn-primary" type="button">Edit</button>

    <div class="photos-subtoolbar" id="gridSubtoolbar">
      <label><input type="checkbox"> Open Photos</label>
      <div class="album-select">Album:
        <select>
          <option>None</option>
        </select>
      </div>
    </div>

    <div class="photos-body">
      <div class="photos-sidebar">
        <div class="sidebar-item"><span class="icon">🖼️</span> Library</div>
        <div class="sidebar-item"><span class="icon">📁</span> Collections</div>
        <div class="sidebar-group-label">Devices</div>
        <div class="sidebar-item active"><span class="icon">📱</span> IMMATERIAL</div>
        <div class="sidebar-group-label">Pinned</div>
        <div class="sidebar-group-label">Albums</div>
        <div class="sidebar-group-label">Sharing</div>
        <div class="sidebar-group-label">Media Types</div>
        <div class="sidebar-group-label">Utilities</div>
        <div class="sidebar-group-label">Projects</div>
      </div>
      <div class="photos-main">
        <div class="photos-grid-view" id="galleryGridView">
          <p class="photos-count">New Photos (15 photos)</p>
          <div class="photos-grid" id="galleryGrid"></div>
        </div>
        <div class="photos-detail-view" id="galleryDetailView" hidden>
          <div class="detail-stage" id="detailStage"></div>
          <div class="detail-filmstrip" id="detailFilmstrip"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ---- Fallback icons if the PNGs haven't been added to the repo yet ----
    function setIconFallback(imgId, svg) {
      const img = document.getElementById(imgId);
      if (!img) return;
      img.addEventListener('error', () => {
        img.src = "data:image/svg+xml;utf8," + svg;
      }, { once: true });
    }

    setIconFallback('infoIconImg',
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 52'>" +
      "<rect width='52' height='52' rx='13' fill='%231a1aff'/>" +
      "<circle cx='26' cy='17' r='3.4' fill='white'/>" +
      "<rect x='22.6' y='23.5' width='6.8' height='19' rx='3.4' fill='white'/>" +
      "</svg>"
    );

    setIconFallback('galleryIconImg',
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 52 52'>" +
      "<rect width='52' height='52' rx='13' fill='%231a1aff'/>" +
      "<circle cx='19' cy='19' r='4' fill='white'/>" +
      "<path d='M10 38 L22 24 L30 32 L36 26 L44 38 Z' fill='white'/>" +
      "</svg>"
    );

    // ---- Gallery data: load real work straight from Cloudinary ----
    // 1. Create a free account at cloudinary.com, copy your "Cloud name" below.
    // 2. Every time you upload a video/photo there, just tag it with CLOUDINARY_TAG
    //    (in the Cloudinary Media Library — no coding, no git, no repo edits).
    // 3. It shows up here automatically, newest first.
    const CLOUDINARY_CLOUD_NAME = "rih889fk"; // <- вставь своё cloud name
    const CLOUDINARY_TAG = "gallery"; // тег, которым помечаешь работы при загрузке

    const PHOTO_GRADIENTS = [
      ['#cbd5e0', '#94a3b8'], ['#f1f5f9', '#cbd5e1'], ['#60a5fa', '#bfdbfe'],
      ['#fbbf24', '#f472b6'], ['#34d399', '#a3e635'], ['#94a3b8', '#e5e7eb'],
      ['#f59e0b', '#b45309'], ['#f97316', '#7c2d12'], ['#fb7185', '#a78bfa'],
      ['#facc15', '#eab308'], ['#a78bfa', '#fca5a5'], ['#d97706', '#78350f'],
      ['#0ea5e9', '#082f49'], ['#334155', '#0f172a'], ['#78716c', '#292524'],
    ];

    function placeholderItems() {
      return PHOTO_GRADIENTS.map(([a, b], i) => ({
        title: `Photo ${i + 1}`,
        thumb: null,
        image: null,
        video: null,
        gradient: [a, b],
        created_at: null,
      }));
    }

    async function fetchCloudinaryList(resourceType) {
      const url = `https://res.cloudinary.com/${CLOUDINARY_CLOUD_NAME}/${resourceType}/list/${CLOUDINARY_TAG}.json`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error(`cloudinary ${resourceType} list failed (${res.status})`);
      const data = await res.json();
      return (Array.isArray(data.resources) ? data.resources : []).map((r) => ({ ...r, resource_type: resourceType }));
    }

    function cloudinaryThumbUrl(item) {
      const base = `https://res.cloudinary.com/${CLOUDINARY_CLOUD_NAME}`;
      if (item.resource_type === 'video') {
        return `${base}/video/upload/so_1,w_400,h_400,c_fill,q_auto,f_jpg/${item.public_id}.jpg`;
      }
      return `${base}/image/upload/w_400,h_400,c_fill,q_auto,f_auto/${item.public_id}.${item.format}`;
    }

    function cloudinaryFullUrl(item) {
      const base = `https://res.cloudinary.com/${CLOUDINARY_CLOUD_NAME}`;
      return `${base}/${item.resource_type}/upload/${item.public_id}.${item.format}`;
    }

    function cloudinaryDetailImageUrl(item) {
      const base = `https://res.cloudinary.com/${CLOUDINARY_CLOUD_NAME}`;
      return `${base}/image/upload/w_1200,q_auto,f_auto/${item.public_id}.${item.format}`;
    }

    async function loadGalleryItems() {
      if (!CLOUDINARY_CLOUD_NAME || CLOUDINARY_CLOUD_NAME === 'YOUR_CLOUD_NAME') {
        return placeholderItems();
      }
      try {
        const [images, videos] = await Promise.all([
          fetchCloudinaryList('image').catch(() => []),
          fetchCloudinaryList('video').catch(() => []),
        ]);
        const raw = [...images, ...videos].sort(
          (a, b) => new Date(b.created_at) - new Date(a.created_at)
        );
        if (raw.length === 0) throw new Error('no items tagged yet');

        return raw.map((item) => ({
          title: item.public_id,
          thumb: cloudinaryThumbUrl(item),
          image: item.resource_type === 'image' ? cloudinaryDetailImageUrl(item) : null,
          video: item.resource_type === 'video' ? cloudinaryFullUrl(item) : null,
          gradient: null,
          created_at: item.created_at || null,
        }));
      } catch (e) {
        return placeholderItems();
      }
    }

    // ---- Icons for the custom video player ----
    const ICON_PLAY = '<svg viewBox="0 0 16 16"><path d="M3 2l11 6-11 6V2z" fill="currentColor"/></svg>';
    const ICON_PAUSE = '<svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.4" height="12" fill="currentColor"/><rect x="9.6" y="2" width="3.4" height="12" fill="currentColor"/></svg>';
    const ICON_REWIND = '<svg viewBox="0 0 16 16"><path d="M8 2L2 8l6 6V2z" fill="currentColor"/><path d="M14 2L8 8l6 6V2z" fill="currentColor"/></svg>';
    const ICON_FORWARD = '<svg viewBox="0 0 16 16"><path d="M8 2l6 6-6 6V2z" fill="currentColor"/><path d="M2 2l6 6-6 6V2z" fill="currentColor"/></svg>';
    const ICON_VOLUME = '<svg viewBox="0 0 16 16"><path d="M2 6v4h3l4 3V3L5 6H2z" fill="currentColor"/><path d="M10.5 5.3a3.6 3.6 0 010 5.4" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>';
    const ICON_MUTE = '<svg viewBox="0 0 16 16"><path d="M2 6v4h3l4 3V3L5 6H2z" fill="currentColor"/><path d="M11 6l3.2 4M14.2 6L11 10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>';

    function styleRangeFill(input) {
      const min = +input.min || 0, max = +input.max || 100, val = +input.value;
      const pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
      input.style.background = `linear-gradient(to right, #0a84ff 0%, #0a84ff ${pct}%, rgba(255,255,255,0.25) ${pct}%, rgba(255,255,255,0.25) 100%)`;
    }

    function buildVideoPlayer(item) {
      const wrap = document.createElement('div');
      wrap.className = 'video-player';

      const backdrop = document.createElement('video');
      backdrop.className = 'video-backdrop';
      backdrop.src = item.video;
      backdrop.muted = true;
      backdrop.playsInline = true;
      backdrop.preload = 'auto';
      backdrop.tabIndex = -1;
      wrap.appendChild(backdrop);

      const video = document.createElement('video');
      video.className = 'video-main';
      video.src = item.video;
      video.playsInline = true;
      video.preload = 'metadata';
      wrap.appendChild(video);

      function syncBackdrop() {
        if (Math.abs(backdrop.currentTime - video.currentTime) > 0.25) {
          backdrop.currentTime = video.currentTime;
        }
      }
      video.addEventListener('play', () => { syncBackdrop(); backdrop.play().catch(() => {}); });
      video.addEventListener('pause', () => backdrop.pause());
      video.addEventListener('seeked', syncBackdrop);
      video.addEventListener('timeupdate', syncBackdrop);

      const controls = document.createElement('div');
      controls.className = 'video-controls';
      controls.innerHTML = `
        <div class="video-controls-row">
          <button class="vc-mute" type="button" aria-label="Mute">${ICON_VOLUME}</button>
          <input class="vc-volume" type="range" min="0" max="1" step="0.01" value="1">
          <div class="video-controls-spacer"></div>
          <button class="vc-rewind" type="button" aria-label="Rewind 10s">${ICON_REWIND}</button>
          <button class="vc-play" type="button" aria-label="Play">${ICON_PLAY}</button>
          <button class="vc-forward" type="button" aria-label="Forward 10s">${ICON_FORWARD}</button>
        </div>
        <input class="vc-seek" type="range" min="0" max="100" value="0" step="0.1">
      `;
      wrap.appendChild(controls);

      const playBtn = controls.querySelector('.vc-play');
      const muteBtn = controls.querySelector('.vc-mute');
      const volumeInput = controls.querySelector('.vc-volume');
      const seekInput = controls.querySelector('.vc-seek');
      const rewindBtn = controls.querySelector('.vc-rewind');
      const forwardBtn = controls.querySelector('.vc-forward');

      styleRangeFill(volumeInput);
      styleRangeFill(seekInput);

      function togglePlay() {
        if (video.paused) video.play(); else video.pause();
      }

      playBtn.addEventListener('click', togglePlay);
      video.addEventListener('click', togglePlay);
      video.addEventListener('play', () => { playBtn.innerHTML = ICON_PAUSE; });
      video.addEventListener('pause', () => { playBtn.innerHTML = ICON_PLAY; });

      rewindBtn.addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 10); });
      forwardBtn.addEventListener('click', () => { video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); });

      volumeInput.addEventListener('input', () => {
        video.volume = +volumeInput.value;
        video.muted = +volumeInput.value === 0;
        muteBtn.innerHTML = video.muted ? ICON_MUTE : ICON_VOLUME;
        styleRangeFill(volumeInput);
      });

      muteBtn.addEventListener('click', () => {
        video.muted = !video.muted;
        muteBtn.innerHTML = video.muted ? ICON_MUTE : ICON_VOLUME;
        if (!video.muted && video.volume === 0) { video.volume = 1; volumeInput.value = 1; }
        styleRangeFill(volumeInput);
      });

      video.addEventListener('timeupdate', () => {
        if (!video.duration) return;
        seekInput.value = (video.currentTime / video.duration) * 100;
        styleRangeFill(seekInput);
      });

      seekInput.addEventListener('input', () => {
        if (!video.duration) return;
        video.currentTime = (+seekInput.value / 100) * video.duration;
        styleRangeFill(seekInput);
      });

      return wrap;
    }

    // ---- Video playback page: separate from the grid, only videos open it ----
    (function() {
      const galleryWindow = document.getElementById('galleryWindow');
      if (!galleryWindow) return;

      const gridView = document.getElementById('galleryGridView');
      const detailView = document.getElementById('galleryDetailView');
      const grid = document.getElementById('galleryGrid');
      const countLabel = document.querySelector('.photos-count');
      const gridModeBar = document.getElementById('gridModeBar');
      const detailModeBar = document.getElementById('detailModeBar');
      const gridSubtoolbar = document.getElementById('gridSubtoolbar');
      const detailStage = document.getElementById('detailStage');
      const detailFilmstrip = document.getElementById('detailFilmstrip');
      const detailTitle = document.getElementById('detailTitle');
      const detailMeta = document.getElementById('detailMeta');
      const detailBackBtn = document.getElementById('detailBackBtn');
      const detailFavBtn = document.getElementById('detailFavBtn');

      let items = [];       // everything shown in the grid (photos + videos)
      let videoItems = [];  // only the videos — this is what the player page navigates
      let currentVideoIndex = 0;

      function gridTileNode(item) {
        const isVideo = !!item.video;
        const tile = document.createElement(isVideo ? 'button' : 'div');
        if (isVideo) tile.type = 'button';
        tile.className = 'photo-tile' + (isVideo ? ' is-video' : '');
        if (item.title) tile.title = item.title;

        if (item.thumb) {
          const img = document.createElement('img');
          img.src = item.thumb;
          img.loading = 'lazy';
          img.alt = item.title || 'edit';
          tile.appendChild(img);
        } else if (item.gradient) {
          tile.style.background = `linear-gradient(135deg, ${item.gradient[0]}, ${item.gradient[1]})`;
        }

        if (isVideo) {
          const videoIndex = videoItems.indexOf(item);
          tile.addEventListener('click', () => openPlayer(videoIndex));
        }
        return tile;
      }

      function filmstripTileNode(item, index) {
        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'filmstrip-thumb';
        if (item.title) tile.title = item.title;
        if (item.thumb) {
          const img = document.createElement('img');
          img.src = item.thumb;
          img.loading = 'lazy';
          img.alt = item.title || 'edit';
          tile.appendChild(img);
        }
        tile.addEventListener('click', () => openPlayer(index));
        return tile;
      }

      function renderGrid() {
        grid.innerHTML = '';
        items.forEach((item) => grid.appendChild(gridTileNode(item)));
        if (countLabel) countLabel.textContent = `New Photos (${items.length} photos)`;
      }

      function renderFilmstrip() {
        detailFilmstrip.innerHTML = '';
        videoItems.forEach((item, i) => {
          const thumb = filmstripTileNode(item, i);
          if (i === currentVideoIndex) thumb.classList.add('active');
          detailFilmstrip.appendChild(thumb);
        });
      }

      function formatMeta(item) {
        const parts = [];
        if (item.created_at) {
          const d = new Date(item.created_at);
          parts.push(d.toLocaleString(undefined, { month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }));
        }
        parts.push(`${currentVideoIndex + 1} of ${videoItems.length}`);
        return parts.join(' · ');
      }

      function openPlayer(index) {
        if (index < 0 || index >= videoItems.length) return;
        currentVideoIndex = index;
        const item = videoItems[currentVideoIndex];

        gridView.hidden = true;
        detailView.hidden = false;
        gridModeBar.hidden = true;
        detailModeBar.hidden = false;
        if (gridSubtoolbar) gridSubtoolbar.hidden = true;

        detailTitle.textContent = item.title || '—';
        detailMeta.textContent = formatMeta(item);
        detailFavBtn.classList.remove('is-active');

        detailStage.innerHTML = '';
        detailStage.appendChild(buildVideoPlayer(item));
        renderFilmstrip();

        const mainVideo = detailStage.querySelector('.video-main');
        if (mainVideo) mainVideo.play().catch(() => {});
      }

      function closePlayer() {
        gridView.hidden = false;
        detailView.hidden = true;
        gridModeBar.hidden = false;
        detailModeBar.hidden = true;
        if (gridSubtoolbar) gridSubtoolbar.hidden = false;
        detailStage.innerHTML = '';
      }

      detailBackBtn.addEventListener('click', closePlayer);
      detailFavBtn.addEventListener('click', () => detailFavBtn.classList.toggle('is-active'));

      document.addEventListener('keydown', (e) => {
        if (!galleryWindow.classList.contains('visible') || detailView.hidden) return;
        const tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

        if (e.key === 'Escape') closePlayer();
        else if (e.key === 'ArrowLeft') openPlayer(currentVideoIndex - 1);
        else if (e.key === 'ArrowRight') openPlayer(currentVideoIndex + 1);
      });

      loadGalleryItems().then((loaded) => {
        items = loaded;
        videoItems = items.filter((i) => i.video);
        renderGrid();
      });
    })();

    // ---- Windows: open / close / hide / drag / bring-to-front ----
    (function() {
      let topZ = 10;
      const controllers = {};

      function setupWindow(win) {
        const titlebar = win.querySelector('.titlebar');
        const closeBtn = win.querySelector('.dot.red');
        const hideBtn = win.querySelector('.dot.yellow');
        let offsetX = 0, offsetY = 0, dragging = false;

        function bringToFront() {
          topZ += 1;
          win.style.zIndex = topZ;
        }

        function toFixedPosition() {
          const rect = win.getBoundingClientRect();
          win.style.left = rect.left + 'px';
          win.style.top = rect.top + 'px';
          win.style.transform = 'none';
        }

        function startDrag(x, y) {
          bringToFront();

          // Freeze the window before converting its centered transform
          // into fixed left/top coordinates. Without this, the opening
          // scale/transform transition can make the first drag jump.
          const rect = win.getBoundingClientRect();
          win.style.transition = 'none';
          win.style.left = rect.left + 'px';
          win.style.top = rect.top + 'px';
          win.style.transform = 'none';

          // Force the browser to apply the new position, then calculate
          // the mouse offset from the actual, final window rectangle.
          void win.offsetWidth;
          const fixedRect = win.getBoundingClientRect();
          offsetX = x - fixedRect.left;
          offsetY = y - fixedRect.top;

          dragging = true;
          titlebar.classList.add('dragging');
          win.classList.add('dragging');
        }

        function moveDrag(x, y) {
          if (!dragging) return;
          const minVisible = 40;
          let left = x - offsetX;
          let top = y - offsetY;
          left = Math.min(Math.max(left, minVisible - win.offsetWidth), window.innerWidth - minVisible);
          top = Math.min(Math.max(top, 0), window.innerHeight - minVisible);
          win.style.left = left + 'px';
          win.style.top = top + 'px';
        }

        function stopDrag() {
          if (!dragging) return;
          dragging = false;
          titlebar.classList.remove('dragging');
          win.classList.remove('dragging');
          // Restore the normal transition after dragging has finished.
          win.style.transition = '';
        }

        titlebar.addEventListener('mousedown', (e) => {
          if (e.target.closest('.dot.red, .dot.yellow, .sidebar-toggle-btn, .detail-back-btn, .icon-btn, .btn-primary, .btn-secondary, input, select')) return;
          startDrag(e.clientX, e.clientY);
          e.preventDefault();
        });
        document.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
        document.addEventListener('mouseup', stopDrag);

        titlebar.addEventListener('touchstart', (e) => {
          if (e.target.closest('.dot.red, .dot.yellow, .sidebar-toggle-btn, .detail-back-btn, .icon-btn, .btn-primary, .btn-secondary, input, select')) return;
          const t = e.touches[0];
          startDrag(t.clientX, t.clientY);
        }, { passive: true });
        document.addEventListener('touchmove', (e) => {
          if (!dragging) return;
          const t = e.touches[0];
          moveDrag(t.clientX, t.clientY);
        }, { passive: true });
        document.addEventListener('touchend', stopDrag);

        win.addEventListener('mousedown', bringToFront);

        function dismiss(e) {
          e.stopPropagation();
          win.classList.remove('visible');
        }
        if (closeBtn) closeBtn.addEventListener('click', dismiss);
        if (hideBtn) hideBtn.addEventListener('click', dismiss);

        window.addEventListener('resize', () => {
          if (win.style.left) {
            const rect = win.getBoundingClientRect();
            const minVisible = 40;
            let left = Math.min(rect.left, window.innerWidth - minVisible);
            let top = Math.min(rect.top, window.innerHeight - minVisible);
            win.style.left = Math.max(left, minVisible - win.offsetWidth) + 'px';
            win.style.top = Math.max(top, 0) + 'px';
          }
        });

        return {
          open() {
            win.classList.add('visible');
            bringToFront();
          }
        };
      }

      document.querySelectorAll('.window').forEach((win) => {
        controllers[win.id] = setupWindow(win);
      });

      document.querySelectorAll('.desktop-icon[data-window]').forEach((icon) => {
        icon.addEventListener('click', () => {
          const controller = controllers[icon.dataset.window];
          if (controller) controller.open();
        });
      });
    })();
  </script>

</body>
</html>
